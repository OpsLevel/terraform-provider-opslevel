kind: Fixed
body: Fixed `opslevel_relationship_definition` writing a blank `id`, `alias` and `name` to state when its relationship definition was deleted outside Terraform. The next apply then failed with "RelationshipDefinition with alias '' does not exist". Read now removes the resource from state, so Terraform plans to recreate it.
